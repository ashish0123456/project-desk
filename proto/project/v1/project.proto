syntax = "proto3";

package project.v1;

option go_package = "gitlab.com/Ash3941/project-management/gen/proto/project/v1;projectv1";

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc AddProjectMember(AddProjectMemberRequest) returns (AddProjectMemberResponse);
}

message CreateProjectRequest {
  string name = 1;
}

message CreateProjectResponse {
  string id = 1;
  string name = 2;
  string created_at = 3;
}

message AddProjectMemberRequest {
  string project_id = 1;
  string user_id = 2;
  string role = 3;
}

message AddProjectMemberResponse {
  string id = 1;
  string project_id = 2;
  string user_id = 3;
  string role = 4;
  string created_at = 5;
}
