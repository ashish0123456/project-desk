workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - build
  # - deploy

variables:
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOTOOLCHAIN: local

cache:
  key: go-modules
  paths:
    - .go/pkg/mod/
    - .go/cache/

unit-tests:
  image: golang:1.26
  stage: test
  parallel:
    matrix:
      - MODULE:
          - gen
          - pkg
          - services/api-gateway
          - services/auth-service
          - services/issue-service
          - services/project-service
          - services/worker-service
  script:
    - go version
    - cd "$MODULE"
    - go test ./...

build-image:
  image: docker:27.5.1-cli
  stage: build
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  parallel:
    matrix:
      - SERVICE: api-gateway
        DOCKERFILE: services/api-gateway/Dockerfile
      - SERVICE: auth-service
        DOCKERFILE: services/auth-service/Dockerfile
      - SERVICE: issue-service
        DOCKERFILE: services/issue-service/Dockerfile
      - SERVICE: project-service
        DOCKERFILE: services/project-service/Dockerfile
      - SERVICE: worker-service
        DOCKERFILE: services/worker-service/Dockerfile
  before_script:
    - until docker info; do sleep 1; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$SERVICE"
    - docker build --pull -f "$DOCKERFILE" -t "$IMAGE:$CI_COMMIT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$IMAGE:$CI_COMMIT_SHA" "$IMAGE:latest"; docker push "$IMAGE:latest"; fi

